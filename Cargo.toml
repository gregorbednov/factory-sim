[package]
name = "factory-sim"
version = "0.1.0"
edition = "2024"
description = "Industrial process simulator"

[lib]
path = "src/web.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["studio", "opcua", "mcp"]
studio = ["dep:eframe", "dep:wgpu", "dep:glam", "dep:tempfile", "dep:bytemuck", "dep:truck-stepio", "dep:truck-meshalgo", "dep:tobj", "dep:stl_io"]
opcua = ["dep:async-opcua"]
mcp = ["dep:rmcp", "dep:schemars"]
web = ["dep:eframe", "dep:wgpu", "dep:glam", "dep:bytemuck", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
fasteval = "0.2"
rand = "0.8"
rand_chacha = "0.3"
log = "0.4"
rapier3d = { version = "0.26", features = ["enhanced-determinism"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
glam = { version = "0.30", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-std", "io-util", "signal"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "tcp-server"] }
async-opcua = { version = "0.19", default-features = false, features = ["client"], optional = true }
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io", "schemars"], optional = true }
schemars = { version = "1", optional = true }
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "x11", "wayland", "clipboard"], optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "gles", "vulkan-portability", "wgsl"], optional = true }
tempfile = { version = "3", optional = true }
truck-stepio = { version = "0.3", optional = true }
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation"], optional = true }
tobj = { version = "4", features = ["use_f64"], optional = true }
stl_io = { version = "0.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "default_fonts"], optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "webgl", "wgsl", "fragile-send-sync-non-atomic-wasm"], optional = true }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"], optional = true }

[dev-dependencies]
truck-modeling = "0.6"

# Keep the default development launch usable on scenes with many contacts.
[profile.dev.package.rapier3d]
opt-level = 3

[profile.dev.package.parry3d]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3

[profile.dev.package.factory-sim]
opt-level = 1
