<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Sim | Веб-приложение</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="workbench">
    <header class="toolbar">
      <a class="home" href="../">Factory Sim</a>
      <h1><span id="project-name">Производственная ячейка</span><span id="unsaved" title="Есть несохранённые изменения" aria-label="Есть несохранённые изменения" hidden>●</span></h1>
      <div class="player" role="group" aria-label="Управление симуляцией">
        <button id="playback" class="primary" type="button" aria-label="Пуск" title="Пуск" disabled>
          <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M7 4.5v15l12-7.5z"/>
          </svg>
          <svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
            <path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/>
          </svg>
        </button>
        <button id="step" type="button" aria-label="Один шаг симуляции" title="Один шаг симуляции" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M5 5v14l11-7zM17 5h2v14h-2z"/>
          </svg>
        </button>
        <button id="reset" type="button" aria-label="Сбросить симуляцию" title="Сбросить симуляцию" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 11a8 8 0 1 1 2.2 6.5M4 5v6h6" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="commands" aria-label="Редактирование и файлы проекта">
        <button id="scene-toggle" type="button" aria-pressed="false" disabled>Сцена</button>
        <button id="library" type="button" aria-pressed="false" disabled>Библиотека элементов</button>
        <button id="inspector" type="button" aria-pressed="true" disabled>Свойства</button>
        <button id="remove" type="button" title="Удалить выбранный объект (Delete)" aria-keyshortcuts="Delete" disabled>Удалить объект</button>
        <details id="project-menu" class="project-menu">
          <summary>Проект</summary>
          <div class="project-actions">
            <button id="new" type="button" disabled>Новый</button>
            <button id="open" type="button" disabled>Открыть JSON</button>
            <button id="save" type="button" disabled>Скачать JSON</button>
            <button id="example" type="button" disabled>Открыть пример</button>
            <button id="import" type="button" disabled>Импорт 3D-модели…</button>
            <button id="production" type="button" disabled>Производство</button>
            <button id="settings" type="button" disabled>Настройки</button>
          </div>
        </details>
        <input id="file" type="file" accept=".json,application/json" hidden>
      </div>
    </header>
    <section class="stage" aria-label="Трёхмерная сцена">
      <canvas id="scene" aria-label="Производственная линия. Перетаскивайте оборудование на паузе."></canvas>
      <div id="splash" class="splash">
        <img src="../assets/production-cell.webp" alt=""
             width="780" height="560">
        <div class="splash-message">
          <p id="boot" role="status"></p>
          <noscript>Для запуска симуляции необходим JavaScript.</noscript>
        </div>
      </div>
    </section>
    <footer class="status">
      <p id="state">Загрузка</p>
      <p id="graphics" hidden></p>
      <p>Время <output id="time">0,0 с</output></p>
      <p>Годные <output id="good">0</output></p>
      <p>Брак <output id="scrap">0</output></p>
      <p id="notice" role="status" hidden></p>
    </footer>
  </main>
  <dialog id="model-dialog" aria-labelledby="model-title">
    <form id="model-form">
      <h2 id="model-title">Импорт 3D-модели</h2>
      <label>Файл изделия <input id="model-file" type="file" accept=".step,.stp,.obj,.stl" required></label>
      <label>Единицы модели
        <select id="model-scale">
          <option value="0.001">Миллиметры</option>
          <option value="0.01">Сантиметры</option>
          <option value="1">Метры</option>
          <option value="0.0254">Дюймы</option>
        </select>
      </label>
      <label>Вертикальная ось
        <select id="model-up"><option value="y">Y</option><option value="z">Z</option></select>
      </label>
      <label>Масса (кг) <input id="model-mass" type="number" min="0.001" max="1000" step="0.001" value="2" required></label>
      <p id="model-error" role="status" hidden></p>
      <div class="dialog-actions">
        <button id="model-cancel" type="button">Отмена</button>
        <button id="model-submit" type="submit" class="primary">Импортировать</button>
      </div>
    </form>
  </dialog>
</body>
</html>
